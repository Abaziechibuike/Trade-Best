<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Sign in | Trade Best</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="container page">
		<div class="panel" style="max-width:520px;margin:auto">
			<a href="/">← Back to shop</a>
			<h1>Shop with Trade Best</h1>
			<p class="muted">Sign in to keep your cart, addresses, orders and wishlist in one place.</p>

			<form id="buyerLogin">
				<label>Email
					<input type="email" name="email" required>
				</label>
				<label>Password
					<input type="password" name="password" required>
				</label>
				<p><button class="primary-btn">Sign in</button></p>
			</form>

			<p style="margin-top:8px"><a href="#" id="buyerForgotToggle">Forgot password?</a></p>

			<form id="buyerForgotForm" style="display:none;margin-top:8px;max-width:520px"> 
				<label>Email
					<input type="email" name="email" required>
				</label>
				<p>
					<button class="secondary-btn" id="buyerForgotBtn">Send reset link</button>
					<button type="button" id="buyerForgotCancel" class="secondary-btn">Cancel</button>
				</p>
			</form>
			<p id="buyerForgotMsg" class="muted" style="margin-top:8px"></p>

			<hr>

			<h2>Create an account</h2>
			<form id="buyerSignup">
				<label>Full name
					<input name="fullName" required>
				</label>
				<label>Email
					<input type="email" name="email" required>
				</label>
				<label>Password
					<input type="password" name="password" minlength="8" required>
				</label>
				<p><button class="secondary-btn">Create buyer account</button></p>
			</form>

			<p id="message" class="muted"></p>
		</div>
	</main>
	<script src="assets/js/buyer-auth.js"></script>
</body>
</html>
