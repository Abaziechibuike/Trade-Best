<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Centre | Trade Best</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/"><span class="brand-mark">TB</span>TRADE BEST</a><nav class="nav-links"><a href="catalog.html">View store</a><button id="logout" class="secondary-btn">Log out</button></nav></div></header><main class="container page"><div class="dashboard"><aside class="panel"><strong id="shopName">Seller Centre</strong><nav class="aside-nav"><a href="#inventory">Inventory</a><a href="#add-product">Add product</a></nav></aside><div><div class="stat-grid"><div class="stat"><span class="muted">Listed products</span><h2 id="productCount">0</h2></div><div class="stat"><span class="muted">In stock units</span><h2 id="stockCount">0</h2></div><div class="stat"><span class="muted">Orders</span><h2>Coming next</h2></div></div><section id="add-product" class="panel" style="margin-top:20px"><h2>Add a product</h2><form id="productForm"><div class="form-grid"><label>Product title<input name="title" required maxlength="140"></label><label>Category<input name="category" required placeholder="e.g. Electronics"></label><label>Price (₦)<input name="price" type="number" min="1" step="0.01" required></label><label>Stock quantity<input name="stock" type="number" min="0" value="0" required></label></div><label>Description<textarea name="description" rows="4" required maxlength="3000"></textarea></label><label>Images (up to 5)<input name="image" type="file" accept="image/*" multiple></label><p><button class="primary-btn">Publish product</button></p></form></section><section id="inventory" class="section"><h2>Your inventory</h2><div id="productsList" class="product-grid"><p class="empty">Loading inventory…</p></div></section></div></div></main><script src="assets/js/dashboard.js"></script></body></html>
