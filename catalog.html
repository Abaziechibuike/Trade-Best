<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | Trade Best</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/"><span class="brand-mark">TB</span>TRADE BEST</a><nav class="nav-links"><a href="seller-login.html">Sell</a><button id="cartButton" class="nav-button">Cart (<span id="cartCount">0</span>)</button></nav></div></header><main class="container page"><h1>Marketplace</h1><form id="searchForm" class="searchbar"><input id="query" placeholder="Search products"><select id="category"><option value="">All categories</option></select><button class="primary-btn">Search</button></form><div id="catalogGrid" class="product-grid"><p class="empty">Loading products…</p></div></main><div id="checkout" class="modal-backdrop hidden"><div class="modal"><button id="closeCart" class="secondary-btn">Close</button><h2>Secure checkout</h2><div id="cartItems"></div><form id="orderForm"><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" required></label><label>Delivery address<textarea name="address" required></textarea></label><label>Payment method<select name="provider"><option value="paystack">Paystack</option><option value="flutterwave">Flutterwave</option></select></label><label>Delivery option<select name="deliveryMode"><option value="manual">Seller delivery / pickup</option><option value="logistics">Logistics partner delivery</option></select></label><p><button class="primary-btn">Continue to secure payment</button></p></form></div></div><script src="assets/js/payment.js"></script></body></html>
