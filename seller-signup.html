<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Seller Sign Up — TRADE BEST</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container" style="padding:48px 0;">
    <a href="index.html" style="display:inline-block;margin-bottom:18px;color:var(--primary-dark);">← Back to home</a>
    <div style="max-width:720px;margin:auto;background:var(--surface);padding:28px;border-radius:12px;box-shadow:var(--shadow);">
      <h1>Create your seller account</h1>
      <p class="lead">Join TRADE BEST to list your products and reach customers across Nigeria.</p>
      <form id="signupForm">
        <label>Business name</label>
        <input type="text" name="businessName" required />

        <label>Owner name</label>
        <input type="text" name="ownerName" required />

        <label>Email</label>
        <input type="email" name="email" required />

        <label>Password</label>
        <input type="password" name="password" required />

        <label>City</label>
        <input type="text" name="city" placeholder="e.g. Lagos" />

        <div style="margin-top:18px;display:flex;gap:12px;">
          <button class="primary-btn" type="submit">Create account</button>
          <a href="seller-login.html" class="secondary-btn">Already have an account? Log in</a>
        </div>
      </form>
      <p id="msg" style="margin-top:12px;color:var(--muted);"></p>
    </div>
  </main>

  <script src="assets/js/auth.js"></script>
</body>
</html>
